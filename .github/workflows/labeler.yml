name: "Pull Request Labeler"

# Area labels from changed files (.github/labeler.yml), then type and size
# labels (.github/scripts/pr-labels.js). Runs on pull_request_target, so it
# uses the default branch's workflow, config and script and never checks out
# or runs PR code: it only reads the title and file list through the API.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]


jobs:
  triage:
    name: Add PR labels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: Add 'revert' label to relevant PRs
        if: contains(github.event.pull_request.title, 'Revert')
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.addLabels({
              owner, repo,
              issue_number: context.payload.pull_request.number,
              labels: ['revert'],
            });

      # The default branch's script (pull_request_target checks out the base).
      - name: Checkout label script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Add type and size labels
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-labels.js`);
            await run({ github, context, core });

    permissions:
      contents: read
      issues: write
      pull-requests: write
