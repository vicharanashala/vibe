name: Deploy Frontend to Firebase

# CI equivalent of the manual deploy:
#   cd frontend && NODE_OPTIONS="--max-old-space-size=8192" pnpm vite build --mode <target>
#   cd .. && firebase deploy --only hosting:<target>
#
# Secrets are read from the `production` GitHub Environment for every target
# (Settings → Environments → production); the target only picks the Vite mode
# and the Firebase hosting target:
#   secrets: GCP_SA_KEY (same key the backend deploy uses; needs Firebase Hosting Admin on vibe-5b35a)
#            VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#            VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#            VITE_FIREBASE_APP_ID, VITE_FIREBASE_MEASUREMENT_ID, VITE_BASE_URL,
#            VITE_RECAPTCHA_SITE_KEY, VITE_IS_RECAPTCHA_ENABLED

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Hosting target to build and deploy"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ inputs.target }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & deploy (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin: use the repo's `packageManager` (pnpm 10).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter frontend...

      - name: Write .env.${{ inputs.target }}
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_IS_RECAPTCHA_ENABLED: ${{ secrets.VITE_IS_RECAPTCHA_ENABLED }}
        run: |
          vars="VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID
                VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID
                VITE_FIREBASE_MEASUREMENT_ID VITE_BASE_URL VITE_RECAPTCHA_SITE_KEY VITE_IS_RECAPTCHA_ENABLED"
          missing=""
          : > ".env.${{ inputs.target }}"
          for v in $vars; do
            [ -z "${!v}" ] && missing="$missing $v"
            printf '%s=%s\n' "$v" "${!v}" >> ".env.${{ inputs.target }}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'production' environment:$missing"
            exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm vite build --mode ${{ inputs.target }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy \
            --only "hosting:${{ inputs.target }}" \
            --non-interactive \
            --message "GitHub Actions: ${GITHUB_SHA::7} by ${GITHUB_ACTOR}"
