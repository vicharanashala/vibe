name: Deploy Frontend to Firebase

# CI equivalent of the manual deploy, run once per hosting target:
#   cd frontend && NODE_OPTIONS="--max-old-space-size=8192" pnpm vite build --mode <target>
#   cd .. && firebase deploy --only hosting:<target>
#
# Staging (vibe-staging-63abb) always deploys; production (vibe-5b35a) deploys
# afterwards only when "Also deploy to production?" is true.
#
# Both targets currently read their secrets from the `production` GitHub
# Environment (Settings → Environments → production). Once staging has its own
# secrets, switch the job's environment to `${{ matrix.target }}`.
#   secrets: GCP_SA_KEY (same key the backend deploy uses; needs Firebase Hosting Admin on vibe-5b35a)
#            VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#            VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#            VITE_FIREBASE_APP_ID, VITE_FIREBASE_MEASUREMENT_ID, VITE_BASE_URL,
#            VITE_RECAPTCHA_SITE_KEY, VITE_IS_RECAPTCHA_ENABLED

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Also deploy to production?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & deploy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # Staging first, then production; a staging failure stops production.
      max-parallel: 1
      fail-fast: true
      matrix:
        target: ${{ fromJSON(inputs.deploy_production == 'true' && '["staging","production"]' || '["staging"]') }}
    environment:
      # TODO: use ${{ matrix.target }} once the staging environment has its own secrets.
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin: use the repo's `packageManager` (pnpm 10).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter frontend...

      - name: Write .env.${{ matrix.target }}
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_IS_RECAPTCHA_ENABLED: ${{ secrets.VITE_IS_RECAPTCHA_ENABLED }}
        run: |
          vars="VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID
                VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID
                VITE_FIREBASE_MEASUREMENT_ID VITE_BASE_URL VITE_RECAPTCHA_SITE_KEY VITE_IS_RECAPTCHA_ENABLED"
          missing=""
          : > ".env.${{ matrix.target }}"
          for v in $vars; do
            [ -z "${!v}" ] && missing="$missing $v"
            printf '%s=%s\n' "$v" "${!v}" >> ".env.${{ matrix.target }}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'production' environment:$missing"
            exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm vite build --mode ${{ matrix.target }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy \
            --only "hosting:${{ matrix.target }}" \
            --non-interactive \
            --message "GitHub Actions: ${GITHUB_SHA::7} by ${GITHUB_ACTOR}"
