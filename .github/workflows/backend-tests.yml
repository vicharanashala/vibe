name: Backend Tests (Vitest)

# Runs the backend Vitest suite. Needs no secrets: MongoDB comes from
# mongodb-memory-server (backend/test/globalSetup.ts) and Firebase Auth from
# the local emulator, so it behaves the same for same-repo and fork PRs.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.34.0

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version pin: action-setup reads the root package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter ./backend...

      # mongodb-memory-server downloads an ~80MB mongod binary on first use.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      # The Auth emulator is pure Node, so no Java setup is needed.
      - name: Start Firebase Auth emulator
        working-directory: backend
        run: |
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} emulators:start \
            --only auth --project demo-test > "$RUNNER_TEMP/firebase-emulator.log" 2>&1 &
          # First run downloads firebase-tools, which took ~55s locally.
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:9099/ > /dev/null && exit 0
            sleep 1
          done
          echo "Auth emulator did not start" >&2
          cat "$RUNNER_TEMP/firebase-emulator.log" >&2
          exit 1

      - name: Run Vitest
        working-directory: backend
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-test
        # These files were already failing on main when this workflow was
        # added (17 Oct 2026), so they are left out until they are fixed:
        #   - no auth token: controller tests that predate @Authorized
        #   - CourseController/CourseVersionController/ItemsController:
        #     "Ambiguous bindings found for service: Symbol(dbURI)"
        #   - AuthController: expects the old "email must be an email" message
        #   - CourseSettingController.backfill: duplicate firebaseUID: null
        # Remove a line once its file passes.
        run: |
          KNOWN_BROKEN=(
            src/modules/anomalies/tests/AnomalyController.test.ts
            src/modules/auth/tests/AuthController.test.ts
            src/modules/courses/tests/CourseController.test.ts
            src/modules/courses/tests/CourseVersionController.test.ts
            src/modules/courses/tests/ItemsController.test.ts
            src/modules/courses/tests/ModuleController.test.ts
            src/modules/courses/tests/SectionController.test.ts
            src/modules/courses/tests/SelectiveProctoring.test.ts
            src/modules/notifications/tests/InviteController.test.ts
            src/modules/quizzes/tests/AttemptController.test.ts
            src/modules/quizzes/tests/QuestionBankController.test.ts
            src/modules/quizzes/tests/QuestionController.test.ts
            src/modules/quizzes/tests/QuizController.test.ts
            src/modules/reports/test/reportController.test.ts
            src/modules/setting/tests/CourseSettingController.backfill.test.ts
            src/modules/users/tests/EnrollementController.test.ts
            src/modules/users/tests/ProgressController.test.ts
            src/modules/users/tests/ProgressService.attemptedItemBypassDeadlock.test.ts
          )
          # --retry=1: CaseStudy.integration and CrowdQuestion.e2e can hit
          # MongoDB's 5ms transaction lock timeout when every file runs in
          # parallel (1 run in 5 locally). A test that fails twice still fails.
          pnpm exec vitest run \
            "${KNOWN_BROKEN[@]/#/--exclude=}" \
            --retry=1 \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml

      # Read by backend-tests-comment.yml, which posts the PR comment. This
      # run's token is read-only on fork PRs, so it can't comment itself.
      - name: Record PR metadata
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p backend/test-results
          echo "$PR_NUMBER" > backend/test-results/pr-number

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore
