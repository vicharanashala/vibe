name: Nightly E2E - Staging

on:
  schedule:
    - cron: '30 20 * * *'   # 2:00 AM IST
  workflow_dispatch:

jobs:
  playwright:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin: action-setup reads the repo's `packageManager`
        # (pnpm 10), which keeps the lockfile compatible and gates dependency
        # postinstall scripts (avoids the broken postman-code-generators script).

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Validate Required Secrets
        id: secrets-check
        run: |
          missing=()
          [[ -z "${{ secrets.STAGING_FRONTEND_URL }}" ]] && missing+=("STAGING_FRONTEND_URL")
          [[ -z "${{ secrets.STUDENT_EMAIL }}" ]] && missing+=("STUDENT_EMAIL")
          [[ -z "${{ secrets.STUDENT_PASSWORD }}" ]] && missing+=("STUDENT_PASSWORD")
          [[ -z "${{ secrets.INSTRUCTOR_EMAIL }}" ]] && missing+=("INSTRUCTOR_EMAIL")
          [[ -z "${{ secrets.INSTRUCTOR_PASSWORD }}" ]] && missing+=("INSTRUCTOR_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing secrets: ${missing[*]}. Tests may fail if STAGING_FRONTEND_URL is missing."
          fi

      - name: Run E2E Tests Against Staging
        run: pnpm --dir e2e test-e2e
        continue-on-error: false
        env:
          BASE_URL: ${{ secrets.STAGING_FRONTEND_URL || 'https://vibe-mythology-streak-badges.vercel.app' }}
          TEST_STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}
          TEST_INSTRUCTOR_EMAIL: ${{ secrets.INSTRUCTOR_EMAIL }}
          TEST_INSTRUCTOR_PASSWORD: ${{ secrets.INSTRUCTOR_PASSWORD }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn