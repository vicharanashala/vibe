name: Nightly E2E - Staging

on:
  schedule:
    - cron: '30 20 * * *'   # 2:00 AM IST
  workflow_dispatch:

jobs:
  playwright:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin: action-setup reads the repo's `packageManager`
        # (pnpm 10), which keeps the lockfile compatible and gates dependency
        # postinstall scripts (avoids the broken postman-code-generators script).

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Check if secrets are available
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.STAGING_FRONTEND_URL }}" && -n "${{ secrets.STUDENT_EMAIL }}" && -n "${{ secrets.STUDENT_PASSWORD }}" ]]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "::warning::Skipping E2E run — staging secrets not configured in this repository. Add STAGING_FRONTEND_URL, STUDENT_EMAIL, STUDENT_PASSWORD to repo secrets."
          fi

      - name: Run E2E Tests Against Staging
        if: steps.check-secrets.outputs.secrets_available == 'true'
        run: pnpm --dir e2e test-e2e
        env:
          BASE_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          TEST_STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}
          TEST_INSTRUCTOR_EMAIL: ${{ secrets.INSTRUCTOR_EMAIL }}
          TEST_INSTRUCTOR_PASSWORD: ${{ secrets.INSTRUCTOR_PASSWORD }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn