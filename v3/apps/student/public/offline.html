<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e36a6a" />
    <title>You’re offline · ViBe</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #fffbf1;
        --fg: #2b2522;
        --muted: #6f6660;
        --primary: #e36a6a;
        --card: #ffffff;
        --border: #efe6d6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1917;
          --fg: #f5efe6;
          --muted: #b3aaa1;
          --card: #26211e;
          --border: #3a332e;
        }
      }
      :root[data-theme='dark'] {
        --bg: #1c1917;
        --fg: #f5efe6;
        --muted: #b3aaa1;
        --card: #26211e;
        --border: #3a332e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 20px;
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
      // Back to where you were as soon as the connection returns. The 'online'
      // event isn't reliable everywhere, so also check every few seconds with a
      // tiny request the service worker never answers from its cache.
      window.addEventListener('online', () => location.reload());
      setInterval(() => {
        fetch('/manifest.webmanifest', { method: 'HEAD', cache: 'no-store' })
          .then((r) => r.ok && location.reload())
          .catch(() => undefined);
      }, 5000);
    </script>
  </head>
